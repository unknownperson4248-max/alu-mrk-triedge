name = "alu-mrk-triedge"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

rules = [
  { type = "Text", globs = ["**/*.html", "**/*.css", "**/*.client.js"], fallthrough = true },
  { type = "Data", globs = ["**/*.jpg", "**/*.png", "**/*.webp"], fallthrough = true },
]

# Website content, uploaded images, quote requests and the admin password hash.
[[kv_namespaces]]
binding = "KV"
id = "ff49aec19dfb4db68a4eaabbc0f35200"

# Cloudflare Workers AI: translates admin text from English to Greek.
[ai]
binding = "AI"

# Preview copy of the site for reviewing design changes (separate data, does not touch the live site).
[env.preview]
name = "alu-mrk-triedge-preview"
workers_dev = true

[env.preview.ai]
binding = "AI"

[[env.preview.kv_namespaces]]
binding = "KV"
id = "a6755b10722b47b1a4dab3d9a6470505"
