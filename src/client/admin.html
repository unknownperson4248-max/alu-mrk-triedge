<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · Alu MRK TriEdge</title>
<link rel="icon" type="image/png" href="/img/icon-dark.png">

<link rel="stylesheet" href="/admin.css?v={{V}}">
</head>
<body>
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <img src="/img/logo-dark.png" alt="Alu MRK TriEdge Ltd" width="111" height="52">
    <h1>Admin panel</h1>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" class="b b-pri">Sign in</button>
    <p class="msg" id="login-msg" role="alert"></p>
  </form>
</div>
<div id="app" class="app" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/admin.js?v={{V}}" defer></script>
</body>
</html>
